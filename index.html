<!DOCTYPE html>
<html>

<head>
    <title>Solid Tiger Thanksgiving Party 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 0 20px;
        }

        a {
            color: #4A90E2;
        }
    </style>
</head>

<body>
    <!--
    Google has gotten increasingly strict about letting Apps Script Web Apps be framed
    inside a third-party page (the sandboxed content layer can send X-Frame-Options
    regardless of what the script itself sets), so this page navigates the whole tab
    instead of embedding an iframe. That trades the branded URL staying in the address
    bar for something that reliably works.

    Two different destinations share this one short URL:
      - no ?id= yet          -> the Google Form guests fill out to RSVP
      - ?id=<guestId> (from  -> the Apps Script Web App (RSVP confirm / gallery,
        the confirmation         routed internally by &page=)
        email's link)
  -->
    <div class="loading" id="fallback">
        <p>Redirecting… if nothing happens, <a id="fallback-link" href="#">click here</a>.</p>
    </div>

    <script>
        // Fill in once you've run createRsvpForm() in the Apps Script editor and have
        // its logged "Public URL" — this is the actual RSVP intake form.
        const RSVP_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScapbsgm6gFpPkHvLp1ab4L5tQ-EcOJg7PG0UXjy57JJA2JNw/viewform";

        // The RSVP APP Web App's deployed /exec URL — handles everything once a guest
        // ID exists (routes internally by &page=: confirm by default, gallery if set).
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby19nKECzSg4JhhDJY80zL4FuDGJy9rmNDKdVToHe8Uuy58emQngQs3eth5Zfv58BgO/exec";

        const hasGuestId = new URLSearchParams(window.location.search).has('id');
        const target = hasGuestId ? APP_SCRIPT_URL + window.location.search : RSVP_FORM_URL;

        document.getElementById('fallback-link').href = target;
        window.location.replace(target);
    </script>
</body>

</html>
